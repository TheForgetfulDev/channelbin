name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a **security vulnerability**,
        please use [private reporting](../../security/advisories/new) instead of filing a
        public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, as specific as you can make them.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ChannelBin version
      description: Shown in Settings, or check `app/version.py` if running from source.
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Docker
        - Running directly with python3 run.py
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Prefer attaching a **Support Bundle** (Settings > Backup & Restore > Support Bundle) -
        it redacts credentials and URLs before writing anything, so it's safe to attach here.
        Please don't paste raw `dvr.log` or `config.yaml` contents.
      render: text

  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label: I've checked that this report doesn't contain any passwords, API keys, or provider URLs/credentials.
          required: true
