# ChannelBin simulator calibration profile - aggregates only.
#
# Measured from two real ChannelBin installs and nothing else: "prod", a snapshot of a
# production install, and "dev", a development install that has run longer and seen more
# recordings, stalls and syncs. The two are never averaged. Every value sits under the
# source it came from, and every paired value that differs materially is listed under
# `disagreements`, so a world built from this file chooses one on purpose.
#
# Nothing here is content. There is no channel name, category name, guide id, host or URL
# in this file, only counts, shares (0 to 1) and percentiles, and counts above 999 are
# rounded to three significant figures. "Shape" values name generic forms (a two-letter
# code and a pipe before the name, a callsign-dot-country guide id), never a value seen.
#
# Regenerated by the project's dev-only calibration tool; do not edit numbers by hand.
schema: 1
measured: '2026-10-16'
sources:
  prod:
    read_at: '2026-10-16'
    schema_version: 93
    accounts: 3
    logs_read: 3
    what: production install, snapshot
  dev:
    read_at: '2026-10-16'
    schema_version: 94
    accounts: 5
    logs_read: 6
    what: development install, long-running, read live
caveats:
- 'dev: no accounts are linked as one provider, so duplicate streams are only ever found within an account
  there'
- channel formats come from health checks, which run on the channels a user chose to test, not a random
  sample of the lineup
- capture numbers come from the recordings each install has made, which are the channels its user wanted
  to watch; retained_recordings covers only the recordings still on disk, while ledger covers every capture
  since the per-account ledger began
