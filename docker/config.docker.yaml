# ChannelBin's container defaults - copied to /config/config.yaml on first run only.
#
# This is deliberately short. Every key the app knows has a built-in default
# (app/config.py), and anything omitted here uses it - so this file carries only the
# handful of values that differ inside a container. The fully annotated template with
# every available setting is at /config/config.example.yaml (refreshed at each start).
#
# Edit this file, or use Settings in the web UI, which writes back to it. Settings marked
# "restart required" need `docker restart channelbin`.

config_version: 1

recording:
  # The recordings volume. Everything the app writes for a recording - segments, the
  # finished file - lands under here, and images (thumbnails, health check screenshots,
  # cached logos) go to its images folder by default (recording.images_dir).
  dvr_output_dir: /dvr

database:
  # On the /config volume, so an image upgrade never takes your recordings history with it.
  path: /config/dvr.db
  # A DB snapshot carries provider credentials in plaintext, and a config backup is this
  # file verbatim - both stay on /config (created 0700), never on the recordings share.
  # Absolute, so it is used exactly as written (a relative value would resolve beside
  # `path` above, i.e. /config/instance/db-backups all the same).
  backup_dir: /config/instance/db-backups

config_backup:
  backup_dir: /config/instance/config-backups

logging:
  level: INFO
  # Both a file and stdout, which is not the app's usual either/or: app/__init__.py adds a
  # stream handler alongside the file handler when it sees the container environment. The
  # file is what the Logs page reads - it tails a path and has no other source - and stdout
  # is what `docker logs` shows, which is the only log surface there is before the UI comes
  # up. On /config so it survives an image upgrade, and rotation is bounded by the
  # logging.max_bytes / backup_count defaults (10 MB x 5).
  file: /config/dvr.log

display:
  # The container's TZ environment variable does not set this. Times in the UI and in
  # recording filenames come from here; any IANA identifier works.
  timezone: America/New_York
  time_format: 12h
